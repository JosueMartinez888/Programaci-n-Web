    <form>
      <label><strong><br><br>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué<br></strong></label>

      <p>
        <label><strong>a) Los comentarios hacen que la computadora imprima el texto después de los caracteres // en la pantalla al momento de ejecutar la secuencia de comandos.</strong>
          <br>
          Verdadero <input name = "incisoa" type="radio">
          Falso <input name = "incisoa" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso a" rows = "3" cols = "40">Hace lo contrario, permite hacer comentarios que no se iimpriman en la pantalal</textarea>
        </label>
      </p>

      <p>
        <label><strong>b) JavaScript considera que las variables numero y NumEro son idénticas.</strong>
          <br>
          Verdadero <input name = "incisob" type="radio">
          Falso <input name = "incisob" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso b" rows = "3" cols = "40">Es falso porque es case sensitive, o sea a pesar de llamarse igual si uno tiene mayusculas y otros no son diferentes</textarea>
        </label>
      </p>

      <p>
        <label><strong>c) El operador == puede usarse sólo con operadores numéricos.</strong>
          <br>
          Verdadero <input name = "incisoc" type="radio">
          Falso <input name = "incisoc" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso c" rows = "3" cols = "40">Es falso porque se puede comparar tambien con valores booleanos y cadenas de texto</textarea>
        </label>
      </p>

      <p>
        <label><strong>d) Los operadores aritméticos +, /, %, x y - tienen todos el mismo nivel de precedencia.</strong>
          <br>
          Verdadero <input name = "incisod" type="radio">
          Falso <input name = "incisod" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso d" rows = "3" cols = "40">No, tienen diferente nivel de precedencia, el modulo, la division y multiplicación tienen mayor precedencia que la suma y resta.</textarea>
        </label>
      </p>

        <label><strong>e) El método parseInt convierte un entero en una cadena.</strong>
          <br>

          <br><br>
