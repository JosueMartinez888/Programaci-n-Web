  <body>
    <form>
      <label><strong><br><br>Escriba una instrucción (o comentario) para realizar cada una de las siguientes tareas:<br></strong></label>

      <p>
        <label><strong>a) Indique que una secuencia de comandos calculará el producto de tres enteros.</strong>
          <br><br>
          <textarea name="inciso a" rows="2" cols="50">// Esta secuencia calculará el producto de 3 enteros</textarea>
        </label>
      </p>

      <p>
        <label><strong>b) Declare las variables x, y, z y resultado.</strong>
          <br><br>
          <textarea name="inciso b" rows="2" cols="50">var x, y, z, resultado;</textarea>
        </label>
      </p>

      <p>
        <label><strong>c) Declare las variables xVal, yVal y zVal.</strong>
          <br><br>
          <textarea name="inciso c" rows="2" cols="50">var xVal, yVal, zVal;</textarea>
        </label>
      </p>

      <p>
        <label><strong>d) Pida al usuario que introduzca el primer valor, lea el valor del usuario y almacénelo en la variable xVal.</strong>
          <br><br>
          <textarea name="inciso d" rows="2" cols="50">xVal = window.prompt("Escriba el primer valor");</textarea>
        </label>
      </p>

      <p>
        <label><strong>e) Pida al usuario que introduzca el segundo valor, lea el valor del usuario y almacénelo en la variable yVal.</strong>
          <br><br>
          <textarea name="inciso e" rows="2" cols="50">yVal = window.prompt("Escriba el segundo valor");</textarea>
        </label>
      </p>

      <p>
        <label><strong>f) Pida al usuario que introduzca el tercer valor, lea el valor del usuario y almacénelo en la variable zVal.</strong>
          <br><br>
          <textarea name="inciso f" rows="2" cols="50">zVal = window.prompt("Escriba el tercer valor");</textarea>
        </label>
      </p>
      <p>
        <label><strong>g) Convierta la cadena xVal en un entero y almacene el resultado en la variable x.</strong>
          <br><br>
          <textarea name="inciso g" rows="2" cols="50">x = parseInt(xVal);</textarea>
        </label>
      </p>

      <p>
        <label><strong>h) Convierta la cadena yVal en un entero y almacene el resultado en la variable y.</strong>
          <br><br>
          <textarea name="inciso h" rows="2" cols="50">y = parseInt(yVal);</textarea>
        </label>
      </p>

      <p>
        <label><strong>i) Convierta la cadena zVal en un entero y almacene el resultado en la variable z.</strong>
          <br><br>
          <textarea name="inciso i" rows="2" cols="50">z = parseInt(zVal);</textarea>
        </label>
      </p>

      <p>
        <label><strong>j) Calcule el producto de los tres enteros contenidos en las variables x, y y z, y asigne el resultado a la variable resultado.</strong>
          <br><br>
          <textarea name="inciso j" rows="2" cols="50">resultado = x * y * z;</textarea>
        </label>
      </p>

      <p>
        <label><strong>k) Escriba una línea de texto de HTML5 que contenga la cadena "El producto es" seguida del valor de la variable resultado.</strong>
          <br><br>
          <textarea name="inciso k" rows="2" cols="50">document.write("&lt;h3&gt;El producto es " + resultado + "&lt;/h3&gt;");</textarea>
        </label>
      </p>
