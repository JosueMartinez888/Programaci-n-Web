    <script>
      //Calculo del producto de 3 variables
      var x,y,z, resultado;
      var xVal, yVal, zVal;

      xVal = window.prompt("Escriba el primer valor");
      yVal = window.prompt("Escriba el segundo valor");
      zVal = window.prompt("Escriba el tercer valor");

      x = parseInt(xVal);
      y = parseInt(yVal);
      z = parseInt(zVal);

      resultado = x * y * z;
      document.write("<h3>El producto es " + resultado + "</h3>")
    </script>
