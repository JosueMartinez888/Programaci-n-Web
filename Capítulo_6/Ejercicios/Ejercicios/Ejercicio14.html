        }

        }

        }

          menor = num4;
        }

          mayor = num3;
        }
        if (mayor < num4){
          mayor = num4;
        }
        if (mayor < num5){
          mayor = num5;
        }
      }

      document.write("<h3>El número menor es: <strong>" + menor + "</strong></h3><br>");
      document.write("<h3>El número mayor es: <strong>" + mayor + "</strong></h3><br>");
