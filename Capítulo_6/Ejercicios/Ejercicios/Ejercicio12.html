    <script type = "text/javascript">
      var numero1, numero2, numero3;
      var num1, num2, num3;
      var suma, promedio, producto, menor, mayor;
      num1 = window.prompt("Introduzca el primer entero:")
      num2 = window.prompt("Introduzca el segundo entero:")
      num3 = window.prompt("Introduzca el tercer entero:")
      numero1 = parseInt(num1);
      numero2 = parseInt(num2);
      numero3 = parseInt(num3); 

      suma = numero1 + numero2 + numero3;
      promedio = suma / 3;
      producto = numero1 * numero2 * numero3;

      menor = numero1;

      if (numero2 < menor)
        menor = numero2;

      if (numero3 < menor)
        menor = numero3;

      mayor = numero1;

      if (numero2 > mayor)
        mayor = numero2;

      if (numero3 > mayor)
        mayor = numero3;

      window.alert("Suma: " + suma + "\nPromedio: " + promedio + "\nProducto: " + producto + "\nMenor: " + menor + "\nMayor: " + mayor);
    </script>
