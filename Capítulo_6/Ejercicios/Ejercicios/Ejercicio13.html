    <title>Ejercicio 13</title>
    <script>
      var radio, radio_input;
      var diametro, circunferencia, area;

      radio_input = window.prompt("Introduzca el radio del círculo:");
      radio = parseFloat(radio_input);

      diametro = 2 * radio;
      circunferencia = 2 * 3.14159 * radio;
      area = 3.14159 * radio * radio;

      document.writeln("<h3>Diámetro: <strong>" + diametro + "</strong></h3><br>");
      document.writeln("<h3>Circunferencia: <strong>" + circunferencia + "</strong></h3><br>");
      document.writeln("<h3>Área: <strong>" + area+ "</strong></h3>");
    </script>
