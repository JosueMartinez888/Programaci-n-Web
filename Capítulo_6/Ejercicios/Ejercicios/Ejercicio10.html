    <title>Ejercicio 10</title>
    <script>
      var primerNumero, segundoNumero;
      var numero1, numero2;
      var suma, producto, diferencia, cociente;

      primerNumero = window.prompt("Escribe el primer numero");
      segundoNumero = window.prompt("Escribe el segundo numero");

      numero1 = parseInt(primerNumero);
      numero2 = parseInt(segundoNumero);

      suma = numero1 + numero2;
      producto = numero1 * numero2;
      diferencia = numero1 - numero2;
      cociente = numero1 / numero2;

      document.writeln("<h3>Numero1: <b>" + numero1 + "</b></h3>")
      document.writeln("<h3>Numero2: <b>" + numero2 + "</b></h3>")
      document.writeln("<h3>Suma: <strong>" + suma + "</strong></h3>")
      document.writeln("<h3>Producto: <strong>" + producto + "</strong></h3>")
      document.writeln("<h3>Diferencia: <strong>" + diferencia + "</strong></h3>")
      document.writeln("<h3>Cociente: <strong>" + cociente + "</strong></h3>")

    </script>
