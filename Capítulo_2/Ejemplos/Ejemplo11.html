<!DOCTYPE html>

<!-- Fig. 2.13: tabla2.html-->
<!-- Tabla de HTML5 compleja-->

<html>
  <head>
    <meta chartset = "utf-8">
    <title>Tablas</title>
  </head>
  <body>
    <h1>Ejemplo de tabla: combinado de filas y columnas</h1>
    <table border = "1">
      <caption>Una tabla de de muestra m&aacute;s compleja</caption>
      <thead>
        <!-- los elementos rowspan y colspan combinan el número-->
        <!-- especificado de celdas en sentido vertical u horizontal-->
        <tr>
          <!-- combina dos filas -->
          <th rowspan = "2">
            <img src="Ejemplo11_images/camello.jpg" width = "205" height = "167" alt="Imagen de un camello con una joroba">
          </th>
          <th colspan = "4">
            <strong>comparaci&oacute;n de cam&eacute;lidos</strong><br>
            Fecha aproximada: 10/2011
          </th>
        </tr>
        <tr>
          <th># jorobas</th>
          <th>Regi&oacute;n ind&iacute;gena</th>
          <th>Escupe?</th>
          <th>Produce lana?</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Camellos (bractrianos)</th>
          <td>2</td>
          <td>Africa/Asia</td>
          <td>S&iacute;</td>
          <td>S&iacute;</td>
        </tr>
        <tr>
          <th>Llamas</th>
          <td>1</td>
          <td>Monta&ntilde;a de los Aldes</td>
          <td>S&iacute;</td>
          <td>S&iacute;</td>
        </tr>
      </tbody>
    </table>
    <p>
    <strong>
      <a href="../Ejemplos/">Men&uacute;</a>
      <a href="../Ejemplos/Ejemplo10.html">Anterior</a>
      <a href="../Ejemplos/Ejemplo12.html">Siguiente</a>
    </strong>
    </p>
  </body>
</html>
