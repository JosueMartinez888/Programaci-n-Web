<!DOCTYPE html>

<!-- Fig. 2.15: formulario2.html-->
<!-- Formulario que usa una variedad de componentes-->
<html>
  <head>
    <meta charset = "utf-8">
    <title>M&aacute;s formularios</title>
  </head>
  <body>
    <h1>Formulario de retroalimentaci&oacute;n</h1>
    <p>Llene este formulario para ayudarnos a mejorar nuestro sitio.</p>
    <form method = "post" action = "http://www.deitel.com">
      <input type="hidden" name="destinatario" value="deitel@deitel.com">
      <input type="hidden" name="asunto" value="Formulario de retroalimentaci&oacute;n">
      <input type="hidden" name="redirigir" value="principal.html">

      <p><label>Nombre:
        <input name="nombre" type="text" size ="25">
      </label></p>

      <p><label>Comentarios: <br>
        <textarea name = "comentarios" rows="4" cols="36">Escriba aqu&iacute; los comentarios</textarea>
      </label></p>

      <!-- <input type = "password"> insergta un -->
      <!-- cuadro de texto que aparece enmascarado con -->
      <!-- caractres de asteriscos-->
      <p><label>Direcci&oacute; de correo electr&oacute;nico
        <input name="email" type = "password" size="25">
      </label></p>

      <p>
      <strong>Cossas que le gustaron</strong><br>
      <label>Dise&ntilde;o del sitio
        <input name = "cosasgustaron" type = "checkbox" value = "Diseño"></label>
      <label>V&iacute;nculo
        <input type="checkbox" name="cosasgustaron" value="Vinculos"></label>
      <label>Facilidad de uso
        <input type="checkbox" name="cosasgustaron" value="Facilidad"></label>
      <label>Im&aacute;genes
        <input type="checkbox" name="cosasgustaron" value="Imagenes"></label>
      <label>C&oacute;digo fuente
        <input type="checkbox" name="cosasgustaron" value="Codigo"></label>
      </p>

      <!-- <input type = "radio" > crea un boton de -->
      <!-- opción. La diferencia entre botontes de opción-->
      <!-- y casillas de verificación es que solo peude seleccionarse-->
      <!-- un botón de opción en un grupo. -->

      <p>
       <strong>C&oacute;mo lleg&oacute; a nuestro sitio</strong><br>
       <label>Motor de  b&uacute;squeda
         <input type="radio" name="comositio" value="motor busqueda" checked></label>
       <label>V&iacute;nculos desde otro sitio
         <input type="radio" name="comositio" value="vínculo"></label>
       <label>Sitio web Deitel.com
         <input type="radio" name="comositio" value="deitel.com"></label>
       <label>Referencia de un libro
         <input type="radio" name="comositio" value="libro"></label>
       <label>Otro
         <input type="radio" name="comositio" value="otro"></label>
      </p>
      <p>
        <label>Califique nuestro sitio
          <!-- la etiqueta <select> presenta una lista-->
          <!-- desplegable con opciones indicadas por las-->
          <!-- etiquetas <option>-->
          <select name="calificación">
            <option selected>Sorprendente</option>
            <option>10</option>
            <option>9</option>
            <option>8</option>
            <option>7</option>
            <option>6</option>
            <option>5</option>
            <option>4</option>
            <option>3</option>
            <option>2</option>
            <option>1</option>
            <option>Malo</option>
          </select>
        </label>
      </p> 
      <p>
        <input type = "submit" value = "Enviar">
        <input type = "reset" value = "Borrar">
      </p>
    </form>
    <p>
    <strong>
      <a href="../Ejemplos/">Men&uacute;</a>
      <a href="../Ejemplos/Ejemplo12.html">Anterior</a>
      <a href="../Ejemplos/Ejemplo14.html">Siguiente</a>
    </strong>
    </p>
  </body>
</html>
