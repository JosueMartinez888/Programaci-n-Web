<!DOCTYPE html>

<!-- Fig. 7.9: promedio2.html-->
<!-- Repetición controlada por centinela para calcular el promedio de una clase.-->
<html>
  <head>
    <meta charset = "utf-8">
    <title>Programa del promedio de una clase: repetición controlada por centinela</title>
    <script>
      var total; // suma de calificaciones 
      var contadorCalificaciones; // número de calificaciones introducidas 
      var califacion; // calificación escrita por el usuario (como cadena)
      var valorCalificacion; // valor de la calificación (convertido a entero)
      var promedio; // promedio de todas las calificaciones

      // Fase de inicialización 
      total = 0; // borrar total 
      contadorCalificacion = 0; // preparar para iterar 

      // Fase de procesamiento, pedir la entrada y leer la calificación del usuario 
      calificacion = window.prompt("Escriba la calificación entera, -1 para salir:", "0"); 

      // convertir calificación de cadena en entero 
      valorCalificacion = parseInt(calificacion);

      while (valorCalificaion != -1 )
      {
        // sumar valorCalificación al total 
        total = total + valorCalificacion;

        // sumar 1 a contador Calificaciones 
        contadorCalificaciones = contadorCalificaciones + 1; 

        // pedir la entrada y leer calificación del usuario 
        calificacion = window.prompt(
          "Escriba la califiación entera, -1 para salir:","0"); 

        // convertir calificación de cadena en entero 
        valorCalificacion = parseInt(calificacion); 
      } // fin de while 

      // Fase de terminación 
      if ( contadorCalificacion != 0 )
      {
        promedio = total / contadorCalificaciones; 

        // muestra el promedio de las calificaciones de los exámenes 
        document.writeln( 
          "<h1>El promedio dela clase es " + promedio + "</h1>");
      } // fin de if 
      else 
        document.writeln("<p>No se introdujeron calificaciones</p>");
    </script>
  </head><body></body>
</html>
