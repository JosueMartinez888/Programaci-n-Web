    <script>
      var secuencia, digito1, digito2, digito3, digito4, aux_secuencia, aux_intercambio;
      while (true){
         secuencia = parseInt(window.prompt("Escriba la secuencia de datos numéricos de 4 dígitos", "1000"));
        if (secuencia >= 1000 && secuencia <= 9999)
          break;
        else
          window.alert("Esa secuencia no es de 4 dígitos, inténtelo de nuevo");
      }

      // Recogiendo los 4 números y cifrándolos
      aux = secuencia;
      digito1 = parseInt(secuencia / 1000);
      secuencia = secuencia - (digito1 * 1000);
      digito1 = (digito1 + 7) % 10;

      digito2 = parseInt(secuencia / 100);
      secuencia = secuencia - (digito2 * 100);
      digito2 = (digito2 + 7) % 10;

      digito3 = parseInt(secuencia / 10);
      secuencia = secuencia - (digito3 * 10);
      digito3 = (digito3 + 7) % 10;

      digito4 = parseInt(secuencia / 1);
      secuencia = secuencia - (digito4 * 1);
      digito4 = (digito4 + 7) % 10;

      // aquí vamos a hacer el intercambio 

      // para el primero con el tercero
      aux_intercambio = digito1;
      digito1 = digito3;
      digito3 = aux_intercambio;

      // para el segundo con el cuarto
      aux_intercambio = digito2;
      digito2 = digito4;
      digito4 = aux_intercambio;

      document.writeln("<h2>Secuencia entera cifrada</h2>");
      document.writeln("<strong>Secuencia cifrada: </strong><b>"+digito1+digito2+digito3+digito4+"</b><br><br>");



    </script>
