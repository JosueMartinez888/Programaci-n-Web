          break
        else

      }
      aux = secuencia;
      primer_digito = parseInt(secuencia / 10000);
      aux1 = primer_digito * 10000;
      secuencia = secuencia - aux1;

      secuencia = secuencia - aux1;

      if (primer_digito == quinto_digito){

          window.alert(aux + " No es un palíndromo");
      }
