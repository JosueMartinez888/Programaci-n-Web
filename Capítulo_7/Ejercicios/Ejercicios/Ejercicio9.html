    <title>Ejercicio 9</title>
    <script type = "text/javascript">
      var contador = 1, numero = -1, mayor_primero = 0, mayor_segundo = 0, ayudante;
      window.alert("Escribirá 10 números y se mostrará el mayor");
      while (contador <= 10){
        numero = parseInt(window.prompt("Contador vuelta "+contador+"\nEscriba un número:", "0"));
        if (numero > mayor_segundo){
          mayor_segundo = numero;
          if (mayor_segundo > mayor_primero){
            ayudante = mayor_primero;
            mayor_primero = mayor_segundo;
            mayor_segundo = ayudante;
          }
        }
        contador++;
      }
      window.alert("El primer número mayor es: " + mayor_primero + "\nEl segundo número mayor es: " + mayor_segundo);
    </script>
