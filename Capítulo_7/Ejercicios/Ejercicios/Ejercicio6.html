    <meta charset = "utf-8">
    <title>Ejercicio 6</title>
    <script type = "text/javascript">
      var empleado, horas, tarifa, sueldo;
      for (empleado = 1; empleado <= 3; empleado++) {
        horas = parseFloat(window.prompt("Empleado " + empleado + ": horas trabajadas:"));
        tarifa = parseFloat(window.prompt("Empleado " + empleado + ": tarifa por hora:"));
        if (isNaN(horas) || isNaN(tarifa) || horas < 0 || tarifa < 0) {
          document.write("<p><strong>Empleado " + empleado + ": datos inválidos.</strong></p>");
        } else {
          if (horas <= 40) sueldo = horas*tarifa;
          else sueldo = 40*tarifa + (horas-40)*tarifa*1.5;
          document.write("<p><b>Empleado " + empleado + "</b><br><strong>Horas:</strong> " + horas + "<br><strong>tarifa: </strong>$" +
            tarifa.toFixed(2) + "<br><strong>sueldo bruto: </strong>$" + sueldo.toFixed(2) + "</p>");
        }
        document.write("<hr>");
      }
    </script>
