<!DOCTYPE html>

<html>
  <head>
    <meta charset = "utf-8">
    <title>Ejercicio 6</title>
  </head>
  <body>
    <h3>Cree un elemento input autocomplete con un elemento datalist 
      asociado que contenga los d&iacute;as de la semana.
      <br><br><br>
      <form method = "post" autocomplete = "on">
        <label>
        <p>Escribe un d&iacute;a de la semana</p>
        <input type="text" name = "listadias" list = "dias_semana">
        <datalist id = "dias_semana">
          <option value="Lunes"></option>
          <option value="Martes"></option>
          <option value="Mi&eacute;rcoles"></option>
          <option value="Jueves"></option>
          <option value="Viernes"></option>
          <option value="S&aacute;bado"></option>
          <option value="Domingo"></option>
        </datalist>
        </label>
        <p>
        <input type="submit" value = "Enviar">
        <input type="reset" value = "Borrar">
        </p>
      </form>
    </h3>
    <p>
    <strong>

      <a href="../../Ejemplos/textoEImagenesEjercicio/Ejercicio3-9.html">Siguiente</a>
    </strong>
    </p>
  </body>
</html>
