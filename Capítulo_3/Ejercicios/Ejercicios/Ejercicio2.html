  <body>
    <form>
      <label><strong><br><br>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué<br></strong></label>

      <p>
        <label><strong>a) Los navegadores que despliegan el tipo input color como campo de texto requieren que el usuario introduzca el nombre de un color.</strong>
        <br>
        Verdadero <input name = "incisoa" type="radio">
        Falso <input name = "incisoa" type="radio" checked>
        <br><br>
        <em>En caso de ser falso argumenta tu respuesta</em>
        <br><br>
        <textarea name="inciso a" rows="3" cols="40">Es falso porque el valor se introduce com un valor hexadecimal.</textarea>
        </label>
      </p>

      <p>
        <label><strong>b) Cuando un usuario introduce datos en un formulario y luego lo envía (por lo general, al hacer clic en el bot&oacute;n Enviar), el navegador verifica de inmediato que los datos sean correctos.</strong>
        <br>
        Verdadero <input name = "incisob" type="radio" checked>
        Falso <input name = "incisob" type="radio">
        <br><br>
        <em>En caso de ser falso argumenta tu respuesta</em>
        <br><br>
        <textarea name="inciso b" rows="3" cols="40"></textarea>
        </label>
      </p>

      <p>

        Falso <input name = "incisoc" type="radio" checked>
        <br><br>
        <em>En caso de ser falso argumenta tu respuesta</em>
        <br><br>
        <textarea name="inciso c" rows="3" cols="40">Es falso porque si puede validar el formato asi de @gmail,hotmail,etc. pero no checa si en verdad existe esa direcci&oacute;n</textarea>
        </label>
      </p>
