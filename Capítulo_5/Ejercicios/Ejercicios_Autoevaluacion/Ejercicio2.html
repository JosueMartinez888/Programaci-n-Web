              padding: 0}

      nav a {color: white;
             text-decoration: none;}
      nav tbody a {color: black}

  <body>
    <form>
      <label><strong><br><br>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué<br></strong></label>

      <p>
        <label><strong>a) La regla @font-face especifica que se utilizará una fuente incrustada cuando el documento se despliegue en una pantalla de computadora.</strong>  
          <br>
          Verdadero <input name = "incisoa" type="radio">
          Falso <input name = "incisoa" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso a" rows = "3" cols = "40">Es falso porque @font-face permite utilizar una fuente personalizada, pero no especifica que se utilice solamente cuando el documento se despliegue en una pantalla de computadora.</textarea>
        </label>
      </p>

      <p>
        <label><strong>b) Podemos usar gradientes en cualquier propiedad que acepte una imagen.</strong>
          <br>
          Verdadero <input name = "incisob" type="radio" checked>
          Falso <input name = "incisob" type="radio">
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso b" rows = "3" cols = "40"></textarea>
        </label>
      </p>

      <p>
        <label><strong>c) Un gradiente horizontal cambia en forma gradual de arriba hacia abajo.</strong>
          <br>
          Verdadero <input name = "incisoc" type="radio">
          Falso <input name = "incisoc" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso c" rows = "3" cols = "40">Es falso porque un gradiente horizontal cambia de izquierda a derecha. Un gradiente vertical cambia de arriba hacia abajo.</textarea>
        </label>
      </p>

      <p>
        <label><strong>d) Podemos agregar líneas entre columnas mediante el uso de la propiedad column-gap.</strong>
          <br>
          Verdadero <input name = "incisod" type="radio">
          Falso <input name = "incisod" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso d" rows = "3" cols = "40">Es falso porque la propiedad column-gap establece el espacio entre las columnas. Para agregar una línea entre ellas se utiliza la propiedad column-rule.</textarea>
        </label>
      </p>

      <p>
        <label><strong>e) La regla @media determina el tipo y tamaño del dispositivo en el que se despliega la página. Cuando el navegador examina la regla, el resultado es verdadero o falso. Los estilos de la regla se aplican sólo si el resultado es falso.</strong>
          <br>
          Verdadero <input name = "incisoe" type="radio">
          Falso <input name = "incisoe" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso e" rows = "3" cols = "40">Es falso porque los estilos dentro de una regla @media se aplican cuando la condición de la regla es verdadera, no cuando es falsa.</textarea>
        </label>
      </p>

      <p>
        <label><strong>f) Para agregar múltiples imágenes de fondo a un elemento, usamos la propiedad background-position para especificar en dónde colocar cada imagen mediante el uso del modelo de cajas.</strong>
          <br>
          Verdadero <input name = "incisof" type="radio">
          Falso <input name = "incisof" type="radio" checked>
          <br><br>
          <em>En caso de ser falso argumenta tu respuesta</em>
          <br><br>
          <textarea name="inciso f" rows = "3" cols = "40">Es falso porque para agregar múltiples imágenes de fondo se utiliza la propiedad background-image. La propiedad background-position se utiliza para indicar la posición de las imágenes de fondo.</textarea>
        </label>
      </p>

    </form>
