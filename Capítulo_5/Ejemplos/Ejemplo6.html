    <meta charset = "utf-8">
    <title>Trazo de texto</title>
    <style type = "text/css">
      h1 {
        color: lightcyan;
        -webkit-text-stroke: 2px black; /* prefijo de proveedor*/
        font-size: 500%; /* aumenta el tamaño de la fuente */
      }
      nav {
        font-weight: bold;
        color: white; 
        background-color: royalblue;
        border: 2px solid royalblue;
        text-align: center;
        width: 14.6em
      }

      nav table {
        margin: 0;
        padding: 0
      }

      nav:hover table tbody {
        display: table-row-group;
      }

      nav table tbody {
        display: none;
        background-color: white;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      nav tbody a {
        color: black
      }
    </style>
  </head>
