<!DOCTYPE html>

<!-- Fig. 5.14: fusionarimagenes.html -->
<!-- Fusionar una imagen en otra mediante CSS3. -->
<html>
  <head>
    <meta charset = "utf-8">
    <title>Fusi&oacute;n de im&aacute;genes</title>
    <style type = "text/css">
      #portada 
        {
        position: relative;
        margin: 0 auto;
      }
      #portada img 
        {
        position: absolute; 
        left: 0;
        -webkit-transition: opacity 4s ease-in-out;
        transition: opacity 4s ease-in-out;
      }
      #portada img.top:hover 
        {opacity: 0;}
      nav {
        font-weight: bold;
        color: white; 
        background-color: royalblue;
        border: 2px solid royalblue;
        text-align: center;
        width: 14.6em
      }

      nav table {
        margin: 0;
        padding: 0
      }

      nav:hover table tbody {
        display: table-row-group;
      }

      nav table tbody {
        display: none;
        background-color: white;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      nav tbody a {
        color: black
      }
    </style>
  </head>
  <body>
    <div id = "portada">
      <img class = "bottom" src="./Ejemplo13_images/jhtp.jpg" 
      alt="Portada de Java 9e">
      <img class = "top" src = "./Ejemplo13_images/jhtp8.jpg"
