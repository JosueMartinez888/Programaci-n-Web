<!DOCTYPE html>

<!-- Fig. 5.10: bordeimagen.html -->
<!-- Estirar y repetir una imagen para crear un borde-->

<html>
  <head>
    <meta charset = "utf-8">
    <title>Borde de imagen</title>
    <style type = "text/css">
      div {
        border-width: 30px;
        border-style: solid;
        width: 80;
        padding: 20px 20px;
      }
      #stretch 
        {
        -webkit-border-image: url(./Ejemplo9_images/borde.jpg) 80 80 80 80 stretch;
        -moz-border-image: url(./Ejemplo9_images/borde.jpg) 80 80 80 80 stretch;
        -o-border-image: url(./Ejemplo9_images/borde.jpg) 80 80 80 80 stretch;
        border-image: url(./Ejemplo9_images/borde.jpg) 80 80 80 80 stretch;
      }

      #repeat 
      {
        -webkit-border-image: url(./Ejemplo9_images/borde.jpg) 34% 34% repeat;
        -moz-border-image: url(./Ejemplo9_images/borde.jpg) 34% 34% repeat;
        -o-border-image: url(./Ejemplo9_images/borde.jpg) 34% 34% repeat;
        border-image: url(./Ejemplo9_images/borde.jpg) 34% 34% repeat;
      }
      nav {
        font-weight: bold;
        color: white; 
        background-color: royalblue;
        border: 2px solid royalblue;
        text-align: center;
        width: 14.6em
      }

      nav table {
        margin: 0;
        padding: 0
      }

      nav:hover table tbody {
        display: table-row-group;
      }

      nav table tbody {
        display: none;
        background-color: white;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      nav tbody a {
        color: black
      }
    </style>
  </head>
  <body>
    <h2>Bordes de imagen</h2>
    <img src="./Ejemplo9_images/borde.jpg" alt="Imagen utilizada para demostrar los bordes" width = "200" height="200">
    <p><div id = "stretch">Se estira el borde de la imagen</div></p>
    <p><div id = "repeat">Se repite el borde de la imagen</div></p>
