<!DOCTYPE html>

<!-- Fig. 5.13: inclinar.html-->
<!-- Elemetnos de inclinación y de transformación en CSS3-->

<html>
  <head>
    <meta charset = "utf-8">
    <title>Inclina (skew)</title>
    <style type = "text/css">
      .skew .textbox 
        {
        margin-left: 75px; 
        background: lightgreen;
        height: 100px;
        width: 200px; 
        padding: 25px 0;
        text-align: center;
        font-size: 250%;
        border: 3px solid DarkGreen;
        border-radius: 15px;
        -webkit-animation: skew 3s infinite linear;
        -moz-animation: skew 3s infinite linear;
        animation: skew 3s infinite linear;
      }
      @-webkit-keyframes skew 
        {
        from {-webkit-transform: skewX(0deg);}
        25% {-webkit-transform: skewX(45deg);}
        50% {-webkit-transform: skewX(0);}
        75% {-webkit-transform: skewX(-45deg);}
        to  {-webkit-transform: skewX(0);}
      }
      @-moz-keyframes skew 
        {
        from {-webkit-transform: skewX(0deg);}
        25% {-webkit-transform: skewX(45deg);}
        50% {-webkit-transform: skewX(0);}
        75% {-webkit-transform: skewX(-45deg);}
        to  {-webkit-transform: skewX(0);}
      }
      @keyframes skew 
        {
        from {-webkit-transform: skewX(0deg);}
        25% {-webkit-transform: skewX(45deg);}
        50% {-webkit-transform: skewX(0);}
        75% {-webkit-transform: skewX(-45deg);}
        to  {-webkit-transform: skewX(0);}
      }
      nav {
        font-weight: bold;
        color: white; 
        background-color: royalblue;
        border: 2px solid royalblue;
        text-align: center;
        width: 14.6em
      }

      nav table {
        margin: 0;
        padding: 0
      }

      nav:hover table tbody {
        display: table-row-group;
      }

      nav table tbody {
        display: none;
        background-color: white;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      nav tbody a {
        color: black
      }
    </style>
  </head>
  <body>
    <div class = "box skew">
      <div class = "textbox">Inclinar texto</div>
    </div>
