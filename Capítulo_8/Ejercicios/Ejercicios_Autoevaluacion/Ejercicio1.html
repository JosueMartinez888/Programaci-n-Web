      <label><strong><br><br>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué<br></strong></label>

          <br><br>
          <textarea name="inciso a" rows = "3" cols = "40">El default es opcional, ya que sino existe ninguno que se adecue oe ntre a los casos entonces simplmenete no hace nada</textarea>

      </p>
