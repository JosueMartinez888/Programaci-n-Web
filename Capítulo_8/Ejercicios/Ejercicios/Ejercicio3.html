    <title>Ejercicio 3</title>
    <script>
      var cantidadALeer, menor = Infinity, numero, num;
      while (true){
        cantidadALeer = parseInt(window.prompt("Escriba cuantos números va a escribir (solo positivos)", "0"));
        if (cantidadALeer <= 0)
          window.alert("Escribe una cantidad de verdad");
        else
          break;
      }
      for (num = 1; num <= cantidadALeer; num++){
        while (true){
          numero = parseInt(window.prompt("Vuelta: " + num + "\nEscribe un número positivo: ","0"));
          if (numero <= 0)
            window.alert("El número debe de ser mayor a 0");
          else
            break;
        }
        if (numero < menor)
          menor = numero;
      }
      window.alert("El número menor es: "+menor);

    </script>
