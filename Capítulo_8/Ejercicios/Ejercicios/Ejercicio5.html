<!DOCTYPE html>

  <head>
    <meta charset = "utf-8">
    <title>Ejercicio 5</title>
    <script>
      var monto;
      var principal = 1000.00;
      var tasa;

      document.writeln("<h2>Ejercicio 5: Interés compuesto</h2>");
      document.writeln("<table class = 'nomenu' border = '1'>");
      document.writeln("<caption>Cálculo del interés compuesto</caption>");
      document.writeln("<thead><tr><th>Tasa de interés</th>");
      document.writeln("<th>Año</th>");
      document.writeln("<th>Monto en depósito</th>");
      document.writeln("</tr></thead><tbody>");

      for (tasa = 5; tasa <= 10; ++tasa)
      {
        for (var anio = 1; anio <= 10; ++anio)
        {
          monto = principal * Math.pow(1.0 + tasa / 100, anio);

          if (anio % 2 !== 0)
            document.writeln("<tr class='filaimpar'><td>" + tasa + "%</td><td>" + anio + "</td><td>$" + monto.toFixed(2) + "</td></tr>");
          else
            document.writeln("<tr><td>" + tasa + "%</td><td>" + anio + "</td><td>$" + monto.toFixed(2) + "</td></tr>");
        }
      }

      document.writeln("</tbody></table><br>");
    </script>     
    <style type = "text/css">
      tr.filaimpar {background-color:white}
      .nomenu {
      table, td, th { border: 1px solid black; padding: 4px;}
      th      {text-align: left; color:white; background-color: darkblue;}
