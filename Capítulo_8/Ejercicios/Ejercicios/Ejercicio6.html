    <title>Ejercicio 3</title>
    <script>
      var numero, i, j;
      for (i = 1; i <= 5; i++) {
        numero = parseInt(window.prompt("Introduce un número del 1 al 30 (" + i + " de 5):", "0"));
        if (numero >= 1 && numero <= 30) {
          document.write("<strong>" + i + ":</strong>");
          for (j = 1; j <= numero; j++) document.write("*");
          document.write("<b> (" + numero + ")</b><br>");
        } else {
          document.write("<p>Entrada que pasa de los 30 o es menor que 30 en el punto " + i + ".</p>");
        }
      }
    </script>
