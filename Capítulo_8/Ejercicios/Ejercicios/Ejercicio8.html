    <meta charset = "utf-8">
    <title>Ejercicio 3</title>
    <script>
      var precio1 = 2.98, precio2 = 4.50, precio3 = 9.98, precio4 = 4.49, precio5 = 6.87;
      var producto, cantidad, precio, total = 0;

      while (true) {
        producto = parseInt(window.prompt("Número de producto (1-5); escribe 0 para terminar:", "0"));

        if (producto === 0) break;

        if (producto < 1 || producto > 5) {
          window.alert("Producto inválido.");
          continue;
        }

        cantidad = parseInt(window.prompt("Cantidad vendida del producto " + producto + ":", "0"));

        if (cantidad < 0) {
          window.alert("La cantidad debe ser un entero no negativo.");
          continue;
        }

        switch (producto) {
          case 1: 
            precio = precio1; 
            break;
          case 2: 
            precio = precio2; 
            break;
          case 3: 
            precio = precio3; 
            break;
          case 4: 
            precio = precio4; 
            break;
          case 5: 
            precio = precio5; 
            break;
        }

        total += precio * cantidad;
      }

      document.write("<strong>Total de ventas: </strong>$" + total.toFixed(2));
    </script>
