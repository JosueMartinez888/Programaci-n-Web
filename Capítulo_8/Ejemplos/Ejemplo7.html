<!DOCTYPE html>
<!-- Ejemplo7.html -->
<html>
  <head>
    <meta charset = "utf-8">
    <title>Uso de la instrucción break en una instrucción for</title>
    <style type = "text/css">

      nav { font-weight: bold; color:white; background-color: royalblue; border: 2px solid royalblue; text-align: center; width: 14.6em}
      nav table {margin: 0; padding: 0}
      nav:hover table tbody {display:table-row-group;}
      nav table tbody {display: none; background-color: white;}
      nav a {color: white; text-decoration: none;}
      nav tbody a {color: black}

    </style>
  </head>
  <body>
    <script type = "text/javascript">
      for (var cuenta = 1; cuenta <= 10; ++cuenta)
      {
        if (cuenta == 5)
          break;
        document.writeln(cuenta + " ");
      }
      document.writeln("<p>Se interrumpió el ciclo en cuenta = " + cuenta + "</p>");
    </script>
    <br>

      </table>

  </body>
