<!DOCTYPE html>
<!-- Ejemplo2.html -->
<html>
  <head>
    <meta charset = "utf-8">
    <title>Repetición controlada por contador</title>
    <style type = "text/css">

      nav { font-weight: bold; color:white; background-color: royalblue; border: 2px solid royalblue; text-align: center; width: 14.6em}
      nav table {margin: 0; padding: 0}
      nav:hover table tbody {display:table-row-group;}
      nav table tbody {display: none; background-color: white;}
      nav a {color: white; text-decoration: none;}
      nav tbody a {color: black}

    </style>
  </head>
  <body>
    <script type = "text/javascript">
      // La inicialización, condición de repetición e incremento se incluyen en el encabezado de for.
      for (var contador = 1; contador <= 7; ++contador)
        document.writeln("<p style = 'font-size: " + contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>");
    </script>
    <br>

      </table>
    </nav>
  </body>
</html>
